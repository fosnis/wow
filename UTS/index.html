
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="stylein.css">
</head>

<body>

    <div class="row">

        
        <div class="col left-col">

            <div class="leftside">

                <div class="art">

                    <img src="colours.png" alt="Artwork">

                </div>

            </div>

        </div>

        
        <div class="col right-col">

            <div class="rightside">

                <img src="astrazeneca.png" alt="logo" class="logo">

                <h2>Log in</h2>

                <form>

                    

    
                    <button type="button" class="google-btn">
                        <image src="google.png" alt="Google Logo" class="google-logo">
                        Sign in with Google
                    </button>

   
                    <div class="divider">
                        <span>or</span>
                    </div>

    
                    <input
                        class="input2"
                        placeholder="Enter email or username"
                        type="text"
                        name="login"
                        required
                    >

    
                    <div class="password-container">
                        <input
                            class="input2"
                            placeholder="Enter password"
                            type="password"
                            name="password"
                            required
                        >

                        <a href="#" class="forgot-password">
                            Forgot Password?
                        </a>
                    </div>

    
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        <span>Remember Me</span>
                    </label>

   
                    <button type="submit" class="signin-btn">
                        Sign In
                    </button>

                </form>     

            </div>
        </div>

    </div>

</body>
</html>
